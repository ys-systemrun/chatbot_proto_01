<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Debug UI</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <h1>Chatbot Debug UI</h1>
        <div id="session-bar">
          <span class="session-label">Session ID:</span>
          <code id="session-id-display">（未開始）</code>
          <button id="reset-btn" title="セッションを削除して会話をリセットする">
            セッションリセット
          </button>
        </div>
      </header>

      <div id="messages"></div>

      <footer id="input-bar">
        <form id="chat-form">
          <textarea
            id="input"
            placeholder="質問を入力… (Ctrl+Enter で送信)"
            rows="3"
            autofocus
          ></textarea>
          <button type="submit" id="send-btn">送信</button>
        </form>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
