[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-deploy"
version = "0.1.0"
description = "chatbot_invitro Terraform デプロイオーケストレータ（コンテナ内 Python, ADR-0040）"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34,<2"]

[project.scripts]
deploy = "src.__main__:main"

[tool.setuptools]
packages = ["src"]
