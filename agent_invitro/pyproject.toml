[project]
name = "agent_invitro"
version = "0.1.0"
description = "Conversation Agent (LangGraph MCP host experiment) for chatbot_invitro"
requires-python = ">=3.11"

dependencies = [
    "langgraph",
    "langchain-mcp-adapters",
    "langchain-openai",
    "ipython",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest",
]
