[project]
name = "agent_invitro"
version = "0.1.0"
description = "Conversation Agent (LangGraph MCP host experiment) for chatbot_invitro"
requires-python = ">=3.11"

dependencies = [
    "langgraph",
    "langchain-mcp-adapters",
    "langchain-openai",
    # AWS 環境（LLM_PROVIDER=bedrock）で ChatBedrockConverse を使うため（IMPL-202608101616）。
    # boto3 は langchain-aws の依存として導入される。
    "langchain-aws",
    "ipython",
    # AWS 環境で常駐 HTTP サービス（/ask-sl・/health）化するため（IMPL-202608241104 T1, ADR-0043）。
    # web_backend / knowledge_mcp / tag_selector_mcp と技術スタックを揃える。ローカル
    # docker-compose の command（sleep infinity）は変更しないため、ローカルの起動時の振る舞いは変わらない。
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"agent_invitro" = "src"}
packages = [
    "agent_invitro",
    "agent_invitro.graph",
    "agent_invitro.mcp_clients",
    "agent_invitro.main",
    "agent_invitro.main.api",
    "agent_invitro.main.ipython",
]

[dependency-groups]
dev = [
    "pytest",
]
