[project]
name = "agent_invitro"
version = "0.1.0"
description = "Conversation Agent (LangGraph MCP host experiment) for chatbot_invitro"
requires-python = ">=3.11"

dependencies = [
    "langgraph",
    "langchain-mcp-adapters",
    "langchain-openai",
    # AWS 環境（LLM_PROVIDER=bedrock）で ChatBedrockConverse を使うため（IMPL-202608101616）。
    # boto3 は langchain-aws の依存として導入される。
    "langchain-aws",
    "ipython",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"agent_invitro" = "src"}
packages = ["agent_invitro", "agent_invitro.graph", "agent_invitro.mcp_clients"]

[dependency-groups]
dev = [
    "pytest",
]
