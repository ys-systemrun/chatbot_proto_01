[project]
name = "chatbot_invitro"
version = "0.1.0"
description = "sample chatbot app"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "psycopg2-binary",
    "requests",
    "numpy",
    # Bedrock 版 LLM クラス（src/llm/*_bedrock.py）が import するため必須。
    "boto3",
    # MCPクライアント（Knowledge MCP 接続）に使用。2.0 系はパッケージ構成が変わるため 1.x 系に固定する。
    "mcp>=1.8.0,<2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.fastapi]
entrypoint = "main.main_stateless:app" 

[project.scripts]
# シード機能は db_hiroba_qa_init サービスへ移管した（IMPL-202608061016）。
debug = "main.debug:main"
debug_question = "main.debug_question:main"
evaluate = "main.evaluate:main"