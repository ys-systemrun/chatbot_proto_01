services:
  web_backend:
    build: ./web_backend
    container_name: chatbot_app
    ports:
      - "${BOT_PORT:-8000}:8000"
    environment:
      # ADR-0052: アプリは用途別 app ロールで接続する（DDL 権限なし）。ロール・パスワードは
      # db_hiroba_qa_init が冪等に作成する。
      - DATABASE_URL=postgresql://chatbot_app:${CHATBOT_APP_PASSWORD:-chatbot_app_pw}@db_support_knowledge:5432/db_hiroba_qa
      - CONVERSATION_DB_URL=postgresql://conversation_app:${CONVERSATION_APP_PASSWORD:-conversation_app_pw}@conversation_db:5432/conversation
      - LMSTUDIO_EMBEDDING_URL=${LMSTUDIO_EMBEDDING_URL}
      - MODEL_EMBEDDING=${MODEL_EMBEDDING}
      - LMSTUDIO_CHAT_URL=${LMSTUDIO_CHAT_URL}
      - MODEL_CHAT=${MODEL_CHAT}
      - CSV_DATA_DIR=${CSV_DATA_DIR}
      - QA_ORIGINAL_FILE=${QA_ORIGINAL_FILE}
      - QUESTION_ALTERED_FILE=${QUESTION_ALTERED_FILE}
      - CATEGORY_FILE=${CATEGORY_FILE}
      - EVAL_QUERIES_CSV=${EVAL_QUERIES_CSV}
      - EVAL_NOISE_QUERIES_CSV=${EVAL_NOISE_QUERIES_CSV}
      # 管理UI（IMPL-202608060837）: Knowledge MCP へ MCPクライアントとして接続する
      - KNOWLEDGE_MCP_URL=${KNOWLEDGE_MCP_URL:-http://knowledge_mcp:8100/mcp}
      # 検証機能（IMPL-202608260909）: Tag Selector MCP へ接続し、検証パラメータを都度渡す。
      - TAG_SELECTOR_MCP_URL=${TAG_SELECTOR_MCP_URL:-http://tag_selector_mcp:8200/mcp}
      - VERIFICATION_MAX_TAGS=${VERIFICATION_MAX_TAGS:-3}
      - VERIFICATION_CONFIDENCE_THRESHOLD=${VERIFICATION_CONFIDENCE_THRESHOLD:-0.0}
      - VERIFICATION_TOP_K=${VERIFICATION_TOP_K:-5}
      - VERIFICATION_MIN_SCORE=${VERIFICATION_MIN_SCORE:-0.0}
    tty: true
    volumes:
      - ./web_backend:/app
      - ./${CSV_DATA_DIR:-data}:/data
    depends_on:
      db_support_knowledge:
        condition: service_healthy
      db_hiroba_qa_init:
        condition: service_completed_successfully
      conversation_db:
        condition: service_healthy
      knowledge_mcp:
        condition: service_healthy
      tag_selector_mcp:
        condition: service_healthy

  frontend:
    build: ./front_dev
    container_name: chatbot_frontend
    ports:
      - "${FRONT_PORT:-5173}:5173"
      - "${STORYBOOK_PORT:-6006}:6006"
    volumes:
      - ./front_dev:/app
      - chatbot_app_node_modules:/app/node_modules
    depends_on:
      - web_backend

  db_support_knowledge:
    image: pgvector/pgvector:pg15
    container_name: chatbot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_hiroba_qa
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # IMPL-202608061016: スキーマ作成は db_hiroba_qa_init に集約したため
      # init.sql のマウントは廃止。データ永続化ボリュームのみ残す。
      - ./${DB_DIR:-db_nomic}/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_hiroba_qa"]
      interval: 5s
      timeout: 5s
      retries: 20

  # IMPL-202608061016 / ADR-0016〜0018:
  # スキーマ作成（マイグレーション）とシード（embedding計算を含む）を一度だけ実行し
  # 終了するワンショットサービス。db_support_knowledge の healthy 後に起動し、正常終了（exit 0）を
  # もって web_backend / knowledge_mcp / tag_selector_mcp の起動条件を満たす。
  db_hiroba_qa_init:
    build: ./db_hiroba_qa_init
    container_name: chatbot_db_init
    environment:
      # マスター接続（ロール作成・CREATE DATABASE 用）。マイグレーション・シードは
      # db_hiroba_qa_init が内部で migrator ロールへ差し替えて実行する（ADR-0052）。
      - DATABASE_URL=postgresql://postgres:postgres@db_support_knowledge:5432/db_hiroba_qa
      # IMPL-202608261022 / ADR-0051: conversation もマスター接続で受け取り、内部で
      # conversation_migrator へ差し替えて yoyo を適用する。ローカルでも常に設定する。
      - CONVERSATION_DB_URL=postgresql://postgres:postgres@conversation_db:5432/conversation
      # 用途別ロールのパスワード（ADR-0052）。ローカルは既定値、AWS は Secrets Manager。
      - CHATBOT_MIGRATOR_PASSWORD=${CHATBOT_MIGRATOR_PASSWORD:-chatbot_migrator_pw}
      - CHATBOT_APP_PASSWORD=${CHATBOT_APP_PASSWORD:-chatbot_app_pw}
      - CONVERSATION_MIGRATOR_PASSWORD=${CONVERSATION_MIGRATOR_PASSWORD:-conversation_migrator_pw}
      - CONVERSATION_APP_PASSWORD=${CONVERSATION_APP_PASSWORD:-conversation_app_pw}
      - EMBEDDING_VECTOR_DIM=${EMBEDDING_VECTOR_DIM}
      - CSV_DATA_DIR=${CSV_DATA_DIR}
      - QA_ORIGINAL_FILE=${QA_ORIGINAL_FILE}
      - QUESTION_ALTERED_FILE=${QUESTION_ALTERED_FILE}
      - CATEGORY_FILE=${CATEGORY_FILE}
      - LMSTUDIO_EMBEDDING_URL=${LMSTUDIO_EMBEDDING_URL}
      - MODEL_EMBEDDING=${MODEL_EMBEDDING}
      # Bedrock 切り替え（IMPL-202608101616）。ローカルは lmstudio 既定で無効。
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-lmstudio}
      - BEDROCK_EMBEDDING_MODEL_ID=${BEDROCK_EMBEDDING_MODEL_ID:-}
      - BEDROCK_REGION=${BEDROCK_REGION:-}
      # マイグレーション専用モード（ADR-0075）。既定は空（＝通常起動: シード投入あり）。
      # スキーマ変更のみを反映したいときは MIGRATE_ONLY=true で起動してシード投入をスキップする。
      # 例: MIGRATE_ONLY=true docker compose run --rm db_hiroba_qa_init
      - MIGRATE_ONLY=${MIGRATE_ONLY:-}
    volumes:
      # ADR-0034: シード元データはイメージに同梱済み（/data に焼き込み）。
      # このマウントはローカル開発でホストの data/ に差し替えたい場合の任意の上書き。
      # AWS(ECS) では同梱データがそのまま使われる（マウント不要）。
      - ./${CSV_DATA_DIR:-data}:/data
    depends_on:
      db_support_knowledge:
        condition: service_healthy
      conversation_db:
        condition: service_healthy
    restart: "no"

  knowledge_mcp:
    build: ./knowledge_mcp
    container_name: chatbot_knowledge_mcp
    ports:
      - "${KNOWLEDGE_MCP_PORT:-8100}:8100"
    environment:
      # ADR-0052: chatbot_app ロール（DML のみ）で接続する。
      - DATABASE_URL=postgresql://chatbot_app:${CHATBOT_APP_PASSWORD:-chatbot_app_pw}@db_support_knowledge:5432/db_hiroba_qa
      - LMSTUDIO_EMBEDDING_URL=${LMSTUDIO_EMBEDDING_URL}
      - MODEL_EMBEDDING=${MODEL_EMBEDDING}
      # Bedrock 切り替え（IMPL-202608101616）。ローカルは lmstudio 既定で無効。
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-lmstudio}
      - BEDROCK_EMBEDDING_MODEL_ID=${BEDROCK_EMBEDDING_MODEL_ID:-}
      - BEDROCK_REGION=${BEDROCK_REGION:-}
      - KNOWLEDGE_MCP_DEFAULT_TOP_K=${KNOWLEDGE_MCP_DEFAULT_TOP_K:-5}
      # IMPL-202608261450: タグ階層展開・タグ構成類似度スコアリング（ADR-0058・ADR-0059）
      - TAG_SIMILARITY_WEIGHT=${TAG_SIMILARITY_WEIGHT:-0.5}
      - SEARCH_CANDIDATE_POOL_SIZE=${SEARCH_CANDIDATE_POOL_SIZE:-}
    depends_on:
      db_support_knowledge:
        condition: service_healthy
      db_hiroba_qa_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  tag_selector_mcp:
    build: ./tag_selector_mcp
    container_name: chatbot_tag_selector_mcp
    ports:
      - "${TAG_SELECTOR_MCP_PORT:-8200}:8200"
    environment:
      # ADR-0052: chatbot_app ロール（DML のみ）で接続する。
      - DATABASE_URL=postgresql://chatbot_app:${CHATBOT_APP_PASSWORD:-chatbot_app_pw}@db_support_knowledge:5432/db_hiroba_qa
      - LLM_PROVIDER=${LLM_PROVIDER:-lmstudio}
      - LMSTUDIO_CHAT_URL=${LMSTUDIO_CHAT_URL}
      - LMSTUDIO_CHAT_MODEL=${LMSTUDIO_CHAT_MODEL:-${MODEL_CHAT}}
      # Bedrock 切り替え（IMPL-202608101616）。ローカルは lmstudio 既定で無効。
      - BEDROCK_CHAT_MODEL_ID=${BEDROCK_CHAT_MODEL_ID:-}
      - BEDROCK_REGION=${BEDROCK_REGION:-}
      - TAXONOMY_RELOAD_INTERVAL_SEC=${TAXONOMY_RELOAD_INTERVAL_SEC:-300}
      - TAG_SELECTOR_DEFAULT_MAX_TAGS=${TAG_SELECTOR_DEFAULT_MAX_TAGS:-3}
      - TAG_SELECTOR_DEFAULT_CONFIDENCE_THRESHOLD=${TAG_SELECTOR_DEFAULT_CONFIDENCE_THRESHOLD:-0.0}
    depends_on:
      db_support_knowledge:
        condition: service_healthy
      db_hiroba_qa_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Conversation Agent（LangGraph MCPホスト実験、IMPL-202608061725 / ADR-0019〜0022）。
  # 常駐HTTPサーバー化はせず、docker compose exec agent_invitro ipython で対話的に動作確認する。
  agent_invitro:
    build: ./agent_invitro
    container_name: chatbot_agent_invitro
    environment:
      - KNOWLEDGE_MCP_URL=${KNOWLEDGE_MCP_URL:-http://knowledge_mcp:8100/mcp}
      - TAG_SELECTOR_MCP_URL=${TAG_SELECTOR_MCP_URL:-http://tag_selector_mcp:8200/mcp}
      - LLM_PROVIDER=${LLM_PROVIDER:-lmstudio}
      - LMSTUDIO_CHAT_URL=${LMSTUDIO_CHAT_URL}
      - LMSTUDIO_CHAT_MODEL=${LMSTUDIO_CHAT_MODEL:-${MODEL_CHAT}}
      # Bedrock 切り替え（IMPL-202608101616）。ローカルは lmstudio 既定で無効。
      - BEDROCK_CHAT_MODEL_ID=${BEDROCK_CHAT_MODEL_ID:-}
      - BEDROCK_REGION=${BEDROCK_REGION:-}
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
    volumes:
      - ./agent_invitro:/app
    depends_on:
      knowledge_mcp:
        condition: service_healthy
      tag_selector_mcp:
        condition: service_healthy

  conversation_db:
    image: postgres:16
    container_name: chatbot_conversation_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conversation
    ports:
      - "${CONVERSATION_DB_PORT:-5433}:5432"
    volumes:
      # IMPL-202608261022 / ADR-0051: スキーマ作成は db_hiroba_qa_init の yoyo に集約したため
      # init.sql のマウントは廃止。データ永続化ボリュームのみ残す。
      - ./db_conversation/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conversation"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chatbot_app_node_modules: