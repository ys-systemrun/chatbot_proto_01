services:
  web_backend:
    build: ./web_backend
    container_name: chatbot_app
    ports:
      - "${BOT_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db_hiroba_qa:5432/chatbot
      - CONVERSATION_DB_URL=postgresql://postgres:postgres@conversation_db:5432/conversation
      - LMSTUDIO_EMBEDDING_URL=${LMSTUDIO_EMBEDDING_URL}
      - MODEL_EMBEDDING=${MODEL_EMBEDDING}
      - LMSTUDIO_CHAT_URL=${LMSTUDIO_CHAT_URL}
      - MODEL_CHAT=${MODEL_CHAT}
      - CSV_DATA_DIR=${CSV_DATA_DIR}
      - QA_ORIGINAL_FILE=${QA_ORIGINAL_FILE}
      - QUESTION_ALTERED_FILE=${QUESTION_ALTERED_FILE}
      - CATEGORY_FILE=${CATEGORY_FILE}
      - EVAL_QUERIES_CSV=${EVAL_QUERIES_CSV}
      - EVAL_NOISE_QUERIES_CSV=${EVAL_NOISE_QUERIES_CSV}
    tty: true
    volumes:
      - ./web_backend:/app
      - ./${CSV_DATA_DIR:-data}:/data
    depends_on:
      db_hiroba_qa:
        condition: service_healthy
      conversation_db:
        condition: service_healthy

  frontend:
    build: ./front_dev
    container_name: chatbot_frontend
    ports:
      - "${FRONT_PORT:-5173}:5173"
      - "${STORYBOOK_PORT:-6006}:6006"
    volumes:
      - ./front_dev:/app
      - chatbot_app_node_modules:/app/node_modules
    depends_on:
      - web_backend

  db_hiroba_qa:
    image: pgvector/pgvector:pg15
    container_name: chatbot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./${DB_DIR:-db_nomic}/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./${DB_DIR:-db_nomic}/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 20

  knowledge_mcp:
    build: ./knowledge_mcp
    container_name: chatbot_knowledge_mcp
    ports:
      - "${KNOWLEDGE_MCP_PORT:-8100}:8100"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db_hiroba_qa:5432/chatbot
      - LMSTUDIO_EMBEDDING_URL=${LMSTUDIO_EMBEDDING_URL}
      - MODEL_EMBEDDING=${MODEL_EMBEDDING}
      - KNOWLEDGE_MCP_DEFAULT_TOP_K=${KNOWLEDGE_MCP_DEFAULT_TOP_K:-5}
    depends_on:
      db_hiroba_qa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  conversation_db:
    image: postgres:16
    container_name: chatbot_conversation_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conversation
    ports:
      - "${CONVERSATION_DB_PORT:-5433}:5432"
    volumes:
      - ./db_conversation/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db_conversation/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conversation"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chatbot_app_node_modules: